name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean tg-video-downloader.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\setup.iss

      - name: Pack portable zip
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\TGVideoDownloader.exe portable\
          Copy-Item installer\portable.dat portable\
          Compress-Archive -Path portable\* -DestinationPath dist\TGVideoDownloader-Portable-1.4.0.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGVideoDownloader-windows
          path: |
            dist/TGVideoDownloader-Setup-1.4.0.exe
            dist/TGVideoDownloader-Portable-1.4.0.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TGVideoDownloader-Setup-1.4.0.exe
            dist/TGVideoDownloader-Portable-1.4.0.zip
          generate_release_notes: true
